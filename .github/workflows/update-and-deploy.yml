name: Update data and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macro-observatory
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Refresh on schedule or manual request
        if: github.event_name != 'push'
        run: python scripts/update.py
      - name: Verify data and calculations
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/core.test.mjs
          node --check site/app.mjs
      - name: Save validated data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official macro snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
